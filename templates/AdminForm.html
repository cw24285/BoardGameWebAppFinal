{% extends base %}

{% block title %}Admin Form Page{% endblock %}

{% block content %}
<div class="adminform-content">
    <table>
        <tr>
            <th>Email</th>
            <th>Name</th>
            <th>Message</th>
        </tr>
        {% for x in forms %}
        <tr>
            <td>{{ x['id'] }}</td>
            <td>{{ x['email'] }}</td>
            <td>{{ x['name'] }}</td>
            <td>{{ x['message'] }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3">No messages yet.</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
